name: BestShot
options:
  bundleIdPrefix: com.bestshot
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  BestShot:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: BestShot
    scheme:
      testTargets:
        - BestShotTests_${platform}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bestshot.app
        CODE_SIGN_ENTITLEMENTS: BestShot/BestShot.entitlements
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "BestShot imports photos and videos you choose so you can rank them."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "BestShot can save exported media back to your photo library."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.photography"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  BestShotTests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    sources:
      - path: BestShotTests
    dependencies:
      - target: BestShot_${platform}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bestshot.app.tests
