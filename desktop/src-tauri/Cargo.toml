[package]
name = "bestshot"
version = "0.2.0"
description = "Fast photo culling for folders of photos"
authors = ["Caddickbrown"]
license = "MIT"
edition = "2021"

[lib]
name = "bestshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
jpeg-decoder = "0.3"
kamadak-exif = "0.6"
walkdir = "2"
trash = "5"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
# Image decoding is painfully slow unoptimised; keep deps fast even in dev builds.
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
