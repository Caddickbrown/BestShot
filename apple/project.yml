name: BestShot
options:
  bundleIdPrefix: com.caddickbrown
  xcodeVersion: "26.5"
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 52W73J6V95
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  BestShot:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: BestShot
    dependencies:
      # Shared Rust core (../core), built by scripts/build-core.sh.
      - framework: Frameworks/BestShotCore.xcframework
        embed: false
    scheme:
      testTargets:
        - BestShotTests_${platform}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caddickbrown.bestshot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: BestShot/BestShot.entitlements
        # The monitor's scene. The Mac has no such thing, so only iOS reads this.
        "INFOPLIST_FILE[sdk=iphoneos*]": Support/Info-iOS.plist
        "INFOPLIST_FILE[sdk=iphonesimulator*]": Support/Info-iOS.plist
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "BestShot imports photos and videos you choose so you can rank them."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "BestShot can save exported media back to your photo library."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "BestShot uses Face ID to open your Hidden photos."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.photography"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  BestShotTests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    sources:
      - path: BestShotTests
    dependencies:
      - target: BestShot_${platform}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caddickbrown.bestshot.tests
